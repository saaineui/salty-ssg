{% extends "_default.html" %}
{% block body %}
  <body class="homepage">
    <div class="grid">
      <header class="sidebar">
        <img class="shaker main" src="{{site.nav.shaker.main.src}}" alt="{{site.nav.shaker.main.alt}}">
        <img class="shaker wow" src="{{site.nav.shaker.wow.src}}" alt="{{site.nav.shaker.main.alt}}">
        <h1>
          <div class="rotating">
            <img class="wordmark" src="{{site.nav.wordmark.src}}" alt="{{site.nav.wordmark.alt}}">
            <br>
            {{site.nav.subtitle}}
          </div>
        </h1>
      </header>
      <main class="with-sidebar">
        {% for block in page.content %}
        {{block | safe}}
        {%- if not loop.last -%}<hr>{% endif %}
        {% endfor %}
      </main>
    </div>
  </body>
{% endblock %}
