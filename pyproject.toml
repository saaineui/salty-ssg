[project]
name = "salty-ssg"
version = "0.1.0"
description = "A perfectly seasoned Static Site Generator"
authors = [
    {name = "saaineui",email = "saaineui@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "markdown-it-py (>=4.2.0,<5.0.0)",
    "linkify-it-py (>=2.1.0,<3.0.0)",
    "mdit-py-plugins (>=0.6.0,<0.7.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]

[tool.poetry]
packages = [{include = "salty_ssg", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
