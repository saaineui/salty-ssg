[project]
name = "salty-ssg"
version = "0.1.0"
description = "A perfectly seasoned Static Site Generator"
authors = [
    {name = "saaineui",email = "saaineui@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.162.6,<0.165.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "markdown-it-py (>=4.2.0,<5.0.0)",
    "mdit-py-plugins (>=0.6.0,<0.7.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "coverage (>=7.14.3,<8.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "poethepoet (>=0.48.0,<0.49.0)",
]

[tool.poetry]
packages = [{include = "salty_ssg", from = "src"}]

[tool.poetry.requires-plugins]
poethepoet = ">=0.48"

[tool.poe.tasks.start]
cmd = "uvicorn main:app --reload"
cwd = "./src/salty_ssg"

[tool.poe.tasks.build]
cmd = "python build.py"
cwd = "./src/salty_ssg"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
